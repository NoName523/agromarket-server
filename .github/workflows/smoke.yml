name: Daily production smoke

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-smoke
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.API_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      EXPECTED_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production API without deploying
        run: node scripts/smoke.js
