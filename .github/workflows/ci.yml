name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agromarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agromarket_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: agromarket_test
      JWT_SECRET: ci-only-test-secret-value-never-used-in-production
      JWT_EXPIRES_IN: 2h
      ADMIN_EMAIL: admin@test.invalid
      ADMIN_PASSWORD: ci-only-test-password
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      API_URL: ${{ vars.API_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      EXPECTED_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment configuration
        run: |
          if [ -z "$API_URL" ] || [ -z "$FRONTEND_URL" ] || [ -z "$EXPECTED_VERSION" ]; then
            echo "API_URL, FRONTEND_URL, and EXPECTED_VERSION variables are required."
            exit 1
          fi
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is required."
            exit 1
          fi
          curl --fail --silent --show-error --request POST \
            --output /dev/null \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${{ github.sha }}"
      - name: Verify production deployment
        run: node scripts/smoke.js
